name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ag/build/outputs/apk/debug/ag-debug.apk

      - name: Publicar APK en Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Zeta.apk
          cp ag/build/outputs/apk/debug/ag-debug.apk AG.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima Zeta.apk AG.apk --title "Zeta - ultima version" --notes "APK compilado automaticamente desde main." --target ${{ github.sha }}
